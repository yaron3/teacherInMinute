name: Android

# Deliberately not wired into the pull request checks yet. This job has never
# run green, and CI that fails for its own reasons is worse than no CI: it
# trains everyone to ignore a red check. Run it by hand from the Actions tab
# until it passes twice on an unchanged tree, then uncomment the pull_request
# trigger below and let it block merges.
#
# It exists because the iOS job cannot see any of this. That job passes
# SKIP_ZERO=1, which makes the "Run skip gradle" phase exit 0 without
# transpiling or building anything for Android, so the entire Android half of
# the app has no automated coverage at all. Three separate failures shipped to
# master that way, the worst of them silent: an app module with no Kotlin
# compilation produced a green build and an APK missing its Application class.
on:
  workflow_dispatch:
    inputs:
      diagnostics-only:
        description: 'Report the toolchain and stop, without building'
        type: boolean
        default: false
  # pull_request:
  #   paths:
  #     - 'teacher-minute/**'
  #     - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build
    # macOS only: the Android build starts in Android/settings.gradle.kts, which
    # shells out to `skip plugin --prebuild` before Gradle configures anything,
    # and skip ships for macOS alone.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The Android SDK proper. It comes first, before Skip, because
      # `skip android sdk install` in the next step puts the Android NDK under
      # the Android SDK root — and run 3 showed what happens when that root
      # does not exist yet:
      #
      #   error: No Android NDK is installed at any of the standard locations
      #
      # macOS arm64 runner images do not ship the Android SDK (run 1 shows this
      # action creating it from scratch at ~/Library/Android/sdk), so with the
      # steps the other way round Skip had nowhere standard to put the NDK and
      # the Swift build could not find one.
      #
      # packages has to be set. Its default is "tools platform-tools", and
      # "tools" is the retired SDK Tools package Google removed from the
      # repository, so sdkmanager reports "Failed to find package 'tools'" and
      # exits 1, which fails the step before Gradle ever runs. platform-tools
      # is a real package and the only one worth asking for here; the platform
      # and build-tools the project needs are downloaded by AGP itself, which
      # is what accept-android-sdk-licenses (on by default) permits.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # Skip's own action. It installs Homebrew, Gradle and the Skip CLI, and
      # tells Xcode to accept Skip's package plugins without an interactive
      # prompt a runner cannot answer.
      #
      # install-swift-android-sdk is the one that matters here. This is a Skip
      # Fuse app — the gradle build runs `skip android build` to compile the
      # Swift sources into libTeacherMinute.so — and that needs the Swift SDK
      # for Android, which this input installs via `skip android sdk install`.
      # Without it the build dies in :skipstone:TeacherMinute:buildAndroidSwiftPackageDebug.
      #
      # That same command installs the NDK, which is why this step runs after
      # the Android SDK is in place. The action also exports an empty
      # ANDROID_NDK_ROOT afterwards on purpose, working around
      # finagolfin/swift-android-sdk#207, so do not set that variable here:
      # discovery is meant to go through the SDK root.
      - name: Set up Skip
        uses: skiptools/actions/setup-skip@v1
        with:
          install-swift-android-sdk: 'true'

      # Diagnostic, not a build step. Runs 3 and 4 both died on
      #   error: No Android NDK is installed at any of the standard locations
      # and the two fixes tried so far were guesses about where the NDK comes
      # from. This prints what is actually on the runner, and it completes
      # minutes before the 18-minute build does, so the answer arrives without
      # waiting for the failure. Remove it once the NDK question is settled.
      - name: Report the Android toolchain the runner actually has
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          echo "ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT:-<unset>}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-<unset>}"
          echo "ANDROID_NDK_LATEST_HOME=${ANDROID_NDK_LATEST_HOME:-<unset>}"
          echo "--- $ANDROID_HOME ---"
          ls -1 "${ANDROID_HOME:-/nonexistent}" || true
          echo "--- $ANDROID_HOME/ndk ---"
          ls -1 "${ANDROID_HOME:-/nonexistent}/ndk" || echo "(no ndk directory)"
          echo "--- ~/Library/Android ---"
          ls -1 ~/Library/Android || true
          echo "--- ~/Library/Developer/Toolchains ---"
          ls -1 ~/Library/Developer/Toolchains || true
          echo "--- swift ---"
          swift --version || true
          echo "--- skip ---"
          skip --version || true
          echo "--- skip doctor ---"
          skip doctor || true
          # Is ANDROID_NDK_ROOT absent, or present and empty? setup-skip exports
          # it empty, and a check for "defined" rather than "non-empty" would
          # then take "" as the NDK path. ${VAR+set} tells the two apart;
          # the ${VAR:-...} forms above cannot.
          echo "--- ANDROID_NDK_ROOT defined? ---"
          echo "defined=${ANDROID_NDK_ROOT+yes}${ANDROID_NDK_ROOT-no}"
          # The Swift SDK for Android bakes absolute NDK paths into its toolset
          # at install time. If those name a version this runner does not have,
          # the "standard locations" message follows even with three NDKs here.
          echo "--- installed Swift SDKs ---"
          ls -1 "$HOME/.swiftpm/swift-sdks" 2>/dev/null || echo "(nothing under ~/.swiftpm/swift-sdks)"
          "$HOME/Library/Developer/Toolchains/swift-6.4.0-RELEASE.xctoolchain/usr/bin/swift" sdk list || true
          echo "--- Swift SDK json ---"
          find -L "$HOME/.swiftpm/swift-sdks" -maxdepth 4 -name "*.json" 2>/dev/null | while read -r f; do
            echo "=== $f"
            cat "$f"
            echo
          done
          echo "--- ndk paths named in those json, and whether they exist ---"
          find -L "$HOME/.swiftpm/swift-sdks" -maxdepth 4 -name "*.json" -exec cat {} + 2>/dev/null \
            | tr "," "\n" | grep -o "/[^\"]*[Nn][Dd][Kk][^\"]*" | sort -u | while read -r q; do
              if [ -e "$q" ]; then echo "EXISTS  $q"; else echo "MISSING $q"; fi
            done

      # Android/gradle/gradle-daemon-jvm.properties pins the daemon to JetBrains
      # JDK 25 and carries the download URLs, so Gradle provisions it itself on
      # first run. No setup-java step: adding one would only supply the launcher
      # JVM, which the runner already has. If provisioning fails, that is the
      # place to look.
      - name: Build the Android app
        if: ${{ ! inputs.diagnostics-only }}
        working-directory: teacher-minute/Android
        run: |
          # setup-skip exports ANDROID_NDK_ROOT as an empty string — not unset —
          # to work around finagolfin/swift-android-sdk#207. The diagnostic
          # confirms it: ${ANDROID_NDK_ROOT+yes} prints yes while the value is
          # "". A caller that tests whether the variable is defined rather than
          # whether it has a value then takes "" as the NDK path, which is how a
          # runner holding 27.3.13750724, 28.2.13676358 and 29.0.14206865 under
          # $ANDROID_HOME/ndk still reports
          #   error: No Android NDK is installed at any of the standard locations
          #
          # :- substitutes for empty as well as unset, so this puts back the
          # image's own default NDK, the one ANDROID_NDK_HOME names, and leaves
          # a non-empty value set by anything else alone.
          export ANDROID_NDK_ROOT="${ANDROID_NDK_ROOT:-$ANDROID_NDK_HOME}"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          ./gradlew assembleDebug --console=plain --stacktrace

      # The assertion that earns this job its keep.
      #
      # `assembleDebug` succeeding is not enough. Gradle does not warn about a
      # source set with no compiler attached, so when the Kotlin Android plugin
      # went missing the build stayed green while all 22 files under
      # app/src/main/kotlin silently stopped being compiled — including Main.kt,
      # which declares the teacher.minute.AndroidAppMain the manifest names as
      # the Application class. The APK installed and the app died at launch on a
      # ClassNotFoundException.
      #
      # So check the artifact rather than the build result: the class the
      # manifest depends on has to be in the dex. Type descriptors live in the
      # dex string pool as "Lteacher/minute/AndroidAppMain;", which grep -a finds
      # without needing build-tools or a dex parser.
      - name: Verify the Application class reached the APK
        if: ${{ ! inputs.diagnostics-only }}
        working-directory: teacher-minute/Android
        run: |
          set -euo pipefail
          apk=$(find ../.build -name 'app-debug.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "::error::no app-debug.apk was produced"
            exit 1
          fi
          echo "checking $apk"
          rm -rf "$RUNNER_TEMP/dex" && mkdir -p "$RUNNER_TEMP/dex"
          unzip -o -j "$apk" 'classes*.dex' -d "$RUNNER_TEMP/dex"
          if ! grep -qa 'teacher/minute/AndroidAppMain' "$RUNNER_TEMP"/dex/*.dex; then
            echo "::error::teacher.minute.AndroidAppMain is not in the APK — the app module's Kotlin was not compiled"
            exit 1
          fi
          echo "AndroidAppMain present"

      # Keeps the APK for a few days so a failure can be inspected without
      # reproducing the whole build locally.
      - name: Upload the APK
        if: ${{ always() && ! inputs.diagnostics-only }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: teacher-minute/.build/**/app-debug.apk
          if-no-files-found: warn
          retention-days: 7
