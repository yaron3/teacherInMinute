			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = "/bin/sh -e";
			shellScript = "# Each app bundles the GoogleService-Info.plist in its own folder, named after\n# its PRODUCT_NAME: InstantTeacher/ or ProTeacher/. Debug builds run against\n# staging when that folder also holds GoogleService-Info-Staging.plist; release\n# builds always use production. With no staging file the app keeps the\n# production config it was built with.\nAPP_DIR=\"${SRCROOT}/${PRODUCT_NAME}\"\nSTAGING=\"${APP_DIR}/GoogleService-Info-Staging.plist\"\nBUNDLED=\"${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/GoogleService-Info.plist\"\nif [ \"${CONFIGURATION}\" = \"Debug\" ] && [ -f \"${STAGING}\" ]; then\n  cp \"${STAGING}\" \"${BUNDLED}\"\n  echo \"note: Firebase config: staging\"\nelse\n  echo \"note: Firebase config: production\"\nfi\n# Google Sign-In raises an exception at sign-in unless Info.plist registers the\n# config's REVERSED_CLIENT_ID as a URL scheme. Info.plist takes that scheme from\n# TIM_GOOGLE_URL_SCHEME, so a config for a different OAuth client stops the\n# build here rather than crashing the app later.\nGOOGLE_SCHEME=$(/usr/libexec/PlistBuddy -c \"Print :REVERSED_CLIENT_ID\" \"${BUNDLED}\" 2>/dev/null || true)\nif [ -n \"${GOOGLE_SCHEME}\" ] && [ \"${GOOGLE_SCHEME}\" != \"${TIM_GOOGLE_URL_SCHEME}\" ]; then\n  echo \"error: ${TARGET_NAME} bundles a Firebase config whose Google client is ${GOOGLE_SCHEME}, but the target registers ${TIM_GOOGLE_URL_SCHEME}. Set TIM_GOOGLE_URL_SCHEME for ${TARGET_NAME} (${CONFIGURATION}) to the REVERSED_CLIENT_ID in that GoogleService-Info.plist.\"\n  exit 1\nfi\n";
		};
