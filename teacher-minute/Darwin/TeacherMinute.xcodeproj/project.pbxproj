			shellPath = "/bin/sh -e";
			shellScript = "if [ \"${SKIP_ZERO}\" != \"\" ]; then\n  echo \"note: skipping skip due to SKIP_ZERO\"\n  exit 0\nelif [ \"${ENABLE_PREVIEWS}\" = \"YES\" ]; then\n  echo \"note: skipping skip due to ENABLE_PREVIEWS\"\n  exit 0\nelif [ \"${ACTION}\" = \"install\" ]; then\n  echo \"note: skipping skip due to archive install\"\n  exit 0\nelif [ \"${SKIP_ACTION}\" = \"none\" ]; then\n  echo \"note: skipping skip due to SKIP_ACTION none\"\n  exit 0\nelse\n  SKIP_ACTION=\"${SKIP_ACTION:-launch}\"\nfi\n# Each app target builds the Android flavor of the same app (TIM_ANDROID_FLAVOR),\n# so the task is e.g. launchStudentDebug. Those launch tasks are defined in\n# Android/app/build.gradle.kts; \"build\" maps to assemble, which builds the APK.\nif [ \"${SKIP_ACTION}\" = \"build\" ]; then\n  GRADLE_TASK=\"assemble${TIM_ANDROID_FLAVOR}${CONFIGURATION:-Debug}\"\nelse\n  GRADLE_TASK=\"${SKIP_ACTION}${TIM_ANDROID_FLAVOR}${CONFIGURATION:-Debug}\"\nfi\nPATH=${BUILD_ROOT}/Release:${BUILD_ROOT}/Debug:${BUILD_ROOT}/../../SourcePackages/artifacts/skip/skip/skip.artifactbundle/macos:${PATH}:${HOMEBREW_PREFIX:-/opt/homebrew}/bin\necho \"note: running gradle build with: $(which skip) gradle -p ${PWD}/../Android ${GRADLE_TASK}\"\nskip gradle -p ../Android ${GRADLE_TASK}\n";
